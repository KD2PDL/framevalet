<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand.name }}</title>
<meta name="description" content="Family photos on the Frame TV">
<link rel="icon" type="image/png" href="/static/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#18140d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ brand.name }}">
<meta property="og:title" content="{{ brand.name }}">
<meta property="og:description" content="Family photos on the Frame TV">
<meta property="og:url" content="{{ base }}/">
<meta property="og:image" content="{{ base }}/share/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  html { background: #18140d; color: #f0e9da; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  main { text-align: center; max-width: 420px; }
  img { width: min(280px, 80vw); height: auto; }
  p { color: #cfc5b0; margin: 1rem 0 1.5rem; }
  a.btn { display: inline-block; background: {{ brand.accent }}; color: #18140d; font-weight: 700; text-decoration: none;
          padding: .8rem 1.6rem; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <img src="/static/logo-dark.png" alt="{{ brand.name }}">
  <p>Family photos on the Frame TV.</p>
  <a class="btn" href="/">Open {{ brand.name }}</a>
</main>
</body>
</html>
